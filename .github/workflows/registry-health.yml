name: registry-health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - mirrors.txt
      - sources.json
      - denylist.txt
      - scripts/discover_mirrors.py
      - scripts/build-registry.sh
      - .github/workflows/registry-health.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Discover untrusted mirror candidates
        run: |
          python3 scripts/discover_mirrors.py \
            --sources sources.json \
            --seed mirrors.txt \
            --current registry-v1.txt \
            --denylist denylist.txt \
            --output /tmp/ghlane-candidates.txt \
            --report /tmp/ghlane-discovery.json

          echo
          echo '=== quarantine discovery report ==='
          cat /tmp/ghlane-discovery.json

      - name: Upload quarantine report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mirror-discovery-report
          path: |
            /tmp/ghlane-candidates.txt
            /tmp/ghlane-discovery.json
          retention-days: 14

  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build trusted production registry
        env:
          SOURCE_FILE: mirrors.txt
          PREVIOUS_FILE: registry-v1.txt
          OUTPUT_FILE: registry-v1.txt
          LEGACY_OUTPUT_FILE: registry.txt
        run: |
          chmod +x scripts/build-registry.sh
          scripts/build-registry.sh

      - name: Commit registry changes
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- registry-v1.txt registry.txt; then
            echo "registry unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry-v1.txt registry.txt
          git commit -m "chore: refresh trusted mirror registry"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main
