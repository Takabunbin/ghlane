name: registry-health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - mirrors.txt
      - sources.json
      - denylist.txt
      - scripts/discover_mirrors.py
      - scripts/build-registry.sh
      - .github/workflows/registry-health.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover mirror candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/discover_mirrors.py \
            --sources sources.json \
            --seed mirrors.txt \
            --current registry.txt \
            --denylist denylist.txt \
            --output /tmp/ghlane-candidates.txt \
            --report /tmp/ghlane-discovery.json

          echo
          echo '=== discovery report ==='
          cat /tmp/ghlane-discovery.json

      - name: Build healthy registry
        env:
          SOURCE_FILE: /tmp/ghlane-candidates.txt
        run: |
          chmod +x scripts/build-registry.sh
          scripts/build-registry.sh

      - name: Commit registry changes
        run: |
          if git diff --quiet -- registry.txt; then
            echo "registry unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.txt
          git commit -m "chore: refresh healthy mirror registry"
          git push
