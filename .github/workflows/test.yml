name: test

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n ghlane
          bash -n install.sh
          bash -n uninstall.sh
          bash -n tests/fault-injection.sh
          bash -n tests/installer-matrix.sh
          bash -n tests/registry.sh
          bash -n scripts/build-registry.sh
          bash -n tests/registry-health.sh
          python3 -m py_compile scripts/discover_mirrors.py tests/discovery.py
          chmod +x ghlane tests/fault-injection.sh tests/installer-matrix.sh tests/registry.sh scripts/build-registry.sh tests/registry-health.sh
          ./ghlane self-test
          test "$(./ghlane version)" = "ghlane 0.2.0"
          CORE="$PWD/ghlane" ./tests/fault-injection.sh
          CORE="$PWD/ghlane" ./tests/registry.sh
          ./tests/registry-health.sh
          python3 tests/discovery.py

  installer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12-slim
            label: debian-12
          - image: debian:13-slim
            label: debian-13
          - image: ubuntu:24.04
            label: ubuntu-24.04
          - image: ubuntu:26.04
            label: ubuntu-26.04
    name: installer (${{ matrix.label }})
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates sudo passwd >/dev/null
          bash -n uninstall.sh
          bash -n tests/installer-matrix.sh
          bash tests/installer-matrix.sh
