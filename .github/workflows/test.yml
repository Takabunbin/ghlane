name: test

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n ghlane
          bash -n install.sh
          bash -n tests/fault-injection.sh
          chmod +x ghlane tests/fault-injection.sh
          ./ghlane self-test
          test "$(./ghlane version)" = "ghlane 0.1.10"
          CORE="$PWD/ghlane" ./tests/fault-injection.sh
